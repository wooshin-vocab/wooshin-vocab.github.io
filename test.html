<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#56B2FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>수행평가전 테스트 | 우신고 빠른 영단어 학습기</title>
<style>
:root{--sky:#56B2FF;--sky-dark:#2E8FD9;--sky-soft:#EAF6FF;--ink:#172033;--muted:#748091;--line:#DCE6EF;--bg:#F6FAFF;--good:#2BA66A;--bad:#EB6555}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;margin:0 auto;padding:18px 16px 30px}.header{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:20px;font-weight:950;letter-spacing:-.045em}.badge{font-size:12px;font-weight:900;color:var(--sky-dark);background:var(--sky-soft);padding:8px 10px;border-radius:999px;white-space:nowrap}.mainnav{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.mainnav a{text-decoration:none;min-height:48px;border-radius:17px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center}.mainnav .active{background:var(--sky);border-color:var(--sky);color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:25px;padding:22px}.panel h2{margin:0 0 9px;font-size:22px}.panel p{margin:0;color:var(--muted);font-size:13px;line-height:1.65}.info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.info div{border:1px solid var(--line);border-radius:15px;padding:11px 6px;text-align:center}.info b{display:block;font-size:18px}.info small{font-size:11px;color:var(--muted)}button{font-family:inherit}.primary{width:100%;min-height:54px;border:0;border-radius:18px;background:var(--sky);color:white;font-size:16px;font-weight:950}.primary:disabled{opacity:.45}.secondary{width:100%;min-height:50px;border:1px solid var(--line);border-radius:17px;background:#fff;color:var(--ink);font-size:14px;font-weight:900;margin-top:9px}.history{margin-top:13px;font-size:12px;color:var(--muted);line-height:1.7}.warn{margin-top:12px;color:var(--bad);font-size:12px;font-weight:850}.quiz{display:none}.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.qcount,.timer,.unanswered{font-size:12px;font-weight:900;background:var(--sky-soft);color:var(--sky-dark);padding:8px 9px;border-radius:999px;white-space:nowrap}.timer.danger{background:#FFF0EE;color:var(--bad)}.progress{height:7px;background:#E4ECF4;border-radius:999px;overflow:hidden;margin-bottom:14px}.progress span{display:block;height:100%;background:var(--sky)}.qcard{background:#fff;border:1px solid var(--line);border-radius:28px;padding:26px 18px}.qword{font-size:40px;font-weight:950;letter-spacing:-.05em;text-align:center}.options{display:grid;gap:9px}.option{min-height:54px;border:1px solid var(--line);border-radius:17px;background:#fff;color:var(--ink);font-size:14px;font-weight:850;text-align:left;padding:12px 14px}.option.selected{border-color:var(--sky);background:var(--sky-soft);color:#226FA9}.quiznav{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.quiznav button{min-height:50px;border-radius:17px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:900}.quiznav .submit{background:var(--sky);border-color:var(--sky);color:#fff}.test-submit{margin-top:10px}.result{display:none;text-align:center}.score{font-size:48px;font-weight:950;color:var(--sky-dark);margin:12px 0}.wronglist{text-align:left;margin-top:18px;max-height:440px;overflow:auto}.wrongitem{padding:12px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.5}.wrongitem b{display:block;font-size:15px;margin-bottom:3px}.resume{display:none;margin-bottom:10px}@media(max-width:380px){.brand{font-size:18px}.qword{font-size:35px}.qtop{flex-wrap:wrap}}

.roundbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.roundbar button{min-height:50px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);font-size:13px;font-weight:950;padding:6px}
.roundbar button small{display:block;margin-top:2px;font-size:10px;font-weight:800;color:var(--muted)}
.roundbar button.active{background:#173B68;border-color:#173B68;color:#fff}
.roundbar button.active small{color:#DDEBFA}
.roundbar button:disabled{opacity:.55}
.round-summary{font-size:12px;font-weight:900;color:#42617F;margin:2px 0 10px;text-align:center}

</style>
</head>
<body>
<main class="app">
<header class="header"><div class="brand">수행평가전 테스트</div><div class="badge" id="attemptBadge">1회차 · 0 / 5회</div></header>
<nav class="mainnav"><a href="./">학습</a><a class="active" href="test.html">테스트</a></nav>
<div class="roundbar" id="roundBar" aria-label="테스트 회차 선택">
<button class="active" data-round="1" type="button">1회차<small>1~500번</small></button>
<button data-round="2" type="button">2회차<small>501~1000번</small></button>
</div>
<div class="round-summary" id="roundSummary">1회차 · 1~500번 단어</div>

<section class="panel" id="startPanel">
<h2>테스트 시작</h2><p id="testDescription">1회차 1~500번 단어 중 100문제를 무작위로 출제합니다. 시험이 시작되면 문제와 선택지는 고정되며, 이전 문항으로 돌아가도 답안이 유지됩니다.</p>
<div class="info"><div><b>100</b><small>문제 수</small></div><div><b>30분</b><small>제한시간</small></div><div><b>5회</b><small>최대 응시</small></div></div>
<button class="primary resume" id="resumeBtn" type="button">진행 중인 테스트 계속하기</button><button class="primary" id="startBtn" type="button">새 테스트 시작</button><div class="history" id="history"></div><div class="warn" id="limitMsg"></div>
</section>
<section class="quiz" id="quizPanel">
<div class="qtop"><div class="qcount" id="qcount">1 / 100</div><div class="unanswered" id="unanswered">미응답 100</div><div class="timer" id="timer">30:00</div></div><div class="progress"><span id="qbar"></span></div>
<div class="qcard"><div class="qword" id="qword"></div><div class="options" id="options"></div></div>
<div class="quiznav"><button id="prevBtn" type="button">← 이전</button><button id="nextBtn" type="button">다음 →</button></div><button class="primary test-submit" id="submitBtn" type="button">테스트 제출하기</button>
</section>
<section class="panel result" id="resultPanel"><h2>테스트 완료</h2><div class="score" id="score"></div><p id="resultText"></p><button class="primary" id="reviewBtn" type="button">오답 플래시카드로 복습</button><button class="secondary" id="backBtn" type="button">테스트 첫 화면으로</button><div class="wronglist" id="wrongList"></div></section>
</main>
<script src="words-v41.js"></script>
<script>
(()=>{
"use strict";

const MAX_ATTEMPTS=5;
const TIME_SECONDS=30*60;
const TARGET=100;
const ROUND_KEY="wooshin-vocab-selected-round-v6";

let currentRound=1;
let active=null;
let timerId=null;
let lastWrong=[];

const $=id=>document.getElementById(id);
const byId=new Map(WORDS.map(x=>[x.id,x]));

function roundWords(round=currentRound){
  return round===1 ? WORDS.slice(0,500) : WORDS.slice(500,1000);
}
function roundBounds(round=currentRound){
  return round===1 ? [1,500] : [501,1000];
}
function historyKey(round=currentRound){
  return `wooshin-vocab-test-history-v6-r${round}`;
}
function activeKey(round=currentRound){
  return `wooshin-vocab-active-test-v6-r${round}`;
}
function wrongKey(round=currentRound){
  return `wooshin-vocab-test-wrong-v6-r${round}`;
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function history(round=currentRound){
  try{return JSON.parse(localStorage.getItem(historyKey(round))||"[]");}
  catch(_){return [];}
}
function saveHistory(h,round=currentRound){
  localStorage.setItem(historyKey(round),JSON.stringify(h));
}
function loadActive(round=currentRound){
  try{return JSON.parse(localStorage.getItem(activeKey(round))||"null");}
  catch(_){return null;}
}
function saveActive(){
  if(active) localStorage.setItem(activeKey(active.round),JSON.stringify(active));
  else localStorage.removeItem(activeKey(currentRound));
}
function uniqueDistractors(correct,pool){
  const candidates=shuffle(pool.filter(x=>x.meaning!==correct));
  const out=[];
  const seen=new Set([correct]);
  for(const x of candidates){
    if(!seen.has(x.meaning)){
      seen.add(x.meaning);
      out.push(x.meaning);
      if(out.length===3)break;
    }
  }
  return out;
}
function newQuestion(x,pool){
  return {id:x.id,options:shuffle([x.meaning,...uniqueDistractors(x.meaning,pool)]),selected:null};
}
function updateRoundUI(){
  const [start,end]=roundBounds();
  $("roundSummary").textContent=`${currentRound}회차 · ${start}~${end}번 단어`;
  $("testDescription").textContent=`${currentRound}회차 ${start}~${end}번 단어 중 100문제를 무작위로 출제합니다. 시험이 시작되면 문제와 선택지는 고정되며, 이전 문항으로 돌아가도 답안이 유지됩니다.`;
  document.querySelectorAll("[data-round]").forEach(b=>b.classList.toggle("active",Number(b.dataset.round)===currentRound));
}
function refreshStart(){
  updateRoundUI();
  const h=history();
  const a=loadActive();
  const used=h.length+(a?1:0);

  $("attemptBadge").textContent=`${currentRound}회차 · ${used} / ${MAX_ATTEMPTS}회`;
  $("history").innerHTML=h.length
    ? `${currentRound}회차 응시 기록: `+h.map((x,i)=>`${i+1}회 ${x.score}/${x.total} (${x.percent}%)`).join(" · ")
    : `${currentRound}회차 완료 응시 기록이 없습니다.`;

  $("resumeBtn").style.display=a?"block":"none";
  $("startBtn").disabled=used>=MAX_ATTEMPTS||!!a;
  $("limitMsg").textContent=
    used>=MAX_ATTEMPTS&&!a?`${currentRound}회차 최대 5회 응시를 모두 완료했습니다.`:
    a?`${currentRound}회차에 진행 중인 테스트가 있습니다. 먼저 이어서 완료해 주세요.`:"";
}
function setRound(round){
  if(round!==1&&round!==2||active)return;
  currentRound=round;
  try{localStorage.setItem(ROUND_KEY,String(round));}catch(_){}
  refreshStart();
}
function startNew(){
  const h=history();
  if(h.length>=MAX_ATTEMPTS||loadActive())return;

  const pool=roundWords();
  const chosen=shuffle(pool).slice(0,Math.min(TARGET,pool.length));
  active={
    round:currentRound,
    attemptNo:h.length+1,
    endAt:Date.now()+TIME_SECONDS*1000,
    index:0,
    questions:chosen.map(x=>newQuestion(x,pool))
  };
  localStorage.setItem(activeKey(currentRound),JSON.stringify(active));
  showQuiz();
}
function resume(){
  active=loadActive();
  if(!active)return;
  currentRound=active.round||currentRound;
  if(Date.now()>=active.endAt){finish(true);return;}
  showQuiz();
}
function toggleRoundControls(disabled){
  document.querySelectorAll("[data-round]").forEach(b=>b.disabled=disabled);
}
function showQuiz(){
  $("startPanel").style.display="none";
  $("resultPanel").style.display="none";
  $("quizPanel").style.display="block";
  toggleRoundControls(true);
  updateRoundUI();
  render();
  clearInterval(timerId);
  timerId=setInterval(tick,1000);
}
function remaining(){
  return Math.max(0,Math.ceil((active.endAt-Date.now())/1000));
}
function tick(){
  const r=remaining();
  renderTimer(r);
  if(r<=0)finish(true);
}
function renderTimer(r=remaining()){
  const m=Math.floor(r/60),s=r%60;
  $("timer").textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  $("timer").classList.toggle("danger",r<=300);
}
function render(){
  if(!active)return;
  active.index=Math.max(0,Math.min(active.index,active.questions.length-1));
  const q=active.questions[active.index];
  const x=byId.get(q.id);

  $("qcount").textContent=`${active.index+1} / ${active.questions.length}`;
  $("qbar").style.width=`${((active.index+1)/active.questions.length)*100}%`;
  $("qword").textContent=x.word;

  const unanswered=active.questions.filter(q=>q.selected===null).length;
  $("unanswered").textContent=`미응답 ${unanswered}`;

  const box=$("options");
  box.innerHTML="";
  q.options.forEach(t=>{
    const b=document.createElement("button");
    b.type="button";
    b.className="option"+(q.selected===t?" selected":"");
    b.textContent=t;
    b.addEventListener("click",()=>{
      q.selected=t;
      localStorage.setItem(activeKey(active.round),JSON.stringify(active));
      render();
    });
    box.appendChild(b);
  });

  $("prevBtn").disabled=active.index===0;
  $("nextBtn").disabled=active.index===active.questions.length-1;
  $("nextBtn").textContent="다음 →";
  renderTimer();
}
function submit(){
  if(!active)return;
  const unanswered=active.questions.filter(q=>q.selected===null).length;
  if(unanswered&&!confirm(`미응답 문항이 ${unanswered}개 있습니다. 그래도 제출할까요?`))return;
  if(confirm(`${active.round}회차 테스트를 최종 제출할까요?`))finish(false);
}
function finish(auto){
  if(!active)active=loadActive();
  if(!active)return;

  clearInterval(timerId);
  currentRound=active.round||currentRound;

  const wrong=[];
  let score=0;
  for(const q of active.questions){
    const x=byId.get(q.id);
    if(q.selected===x.meaning)score++;
    else wrong.push({id:x.id,word:x.word,meaning:x.meaning,selected:q.selected});
  }

  const h=history(currentRound);
  const percent=Math.round(score/active.questions.length*100);
  h.push({
    round:currentRound,
    score,
    total:active.questions.length,
    percent,
    endedAt:new Date().toISOString(),
    autoSubmitted:auto
  });
  saveHistory(h,currentRound);

  lastWrong=wrong.map(x=>x.id);
  localStorage.setItem(wrongKey(currentRound),JSON.stringify(lastWrong));
  localStorage.removeItem(activeKey(currentRound));
  active=null;

  $("quizPanel").style.display="none";
  $("resultPanel").style.display="block";
  toggleRoundControls(false);
  $("score").textContent=`${score} / ${TARGET}`;
  $("resultText").textContent=`${currentRound}회차 · 정답률 ${percent}% · 오답 ${wrong.length}개${auto?" · 시간 종료로 자동 제출되었습니다.":""}`;
  $("reviewBtn").style.display=wrong.length?"block":"none";
  $("wrongList").innerHTML=wrong.length
    ? "<h3>오답 확인</h3>"+wrong.map(x=>`<div class="wrongitem"><b>${x.word}</b>정답: ${x.meaning}<br>선택: ${x.selected??"미응답"}</div>`).join("")
    : "<div class='wrongitem'><b>전부 정답입니다!</b></div>";

  refreshStart();
}
$("startBtn").addEventListener("click",startNew);
$("resumeBtn").addEventListener("click",resume);
$("prevBtn").addEventListener("click",()=>{
  if(active&&active.index>0){
    active.index--;
    localStorage.setItem(activeKey(active.round),JSON.stringify(active));
    render();
  }
});
$("nextBtn").addEventListener("click",()=>{
  if(active&&active.index<active.questions.length-1){
    active.index++;
    localStorage.setItem(activeKey(active.round),JSON.stringify(active));
    render();
  }
});
$("submitBtn").addEventListener("click",submit);
$("reviewBtn").addEventListener("click",()=>{location.href=`./?mode=test-wrong&round=${currentRound}`;});
$("backBtn").addEventListener("click",()=>{
  $("resultPanel").style.display="none";
  $("startPanel").style.display="block";
  toggleRoundControls(false);
  refreshStart();
});
document.querySelectorAll("[data-round]").forEach(b=>b.addEventListener("click",()=>setRound(Number(b.dataset.round))));
window.addEventListener("beforeunload",e=>{
  if(active){e.preventDefault();e.returnValue="";}
});

try{
  const savedRound=Number(localStorage.getItem(ROUND_KEY)||1);
  currentRound=savedRound===2?2:1;
}catch(_){}

refreshStart();
const existing=loadActive();
if(existing){
  active=existing;
  currentRound=existing.round||currentRound;
  if(Date.now()>=active.endAt)finish(true);
  else refreshStart();
}

if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
})();
</script>
</body>
</html>
