<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#56B2FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>수행평가전 테스트 | 우신고 빠른 영단어 학습기</title>
<style>
:root{--sky:#56B2FF;--sky-dark:#2E8FD9;--sky-soft:#EAF6FF;--ink:#172033;--muted:#748091;--line:#DCE6EF;--bg:#F6FAFF;--good:#2BA66A;--bad:#EB6555}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;margin:0 auto;padding:18px 16px 30px}.header{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:20px;font-weight:950;letter-spacing:-.045em}.badge{font-size:12px;font-weight:900;color:var(--sky-dark);background:var(--sky-soft);padding:8px 10px;border-radius:999px;white-space:nowrap}.mainnav{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.mainnav a{text-decoration:none;min-height:48px;border-radius:17px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center}.mainnav .active{background:var(--sky);border-color:var(--sky);color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:25px;padding:22px}.panel h2{margin:0 0 9px;font-size:22px}.panel p{margin:0;color:var(--muted);font-size:13px;line-height:1.65}.info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.info div{border:1px solid var(--line);border-radius:15px;padding:11px 6px;text-align:center}.info b{display:block;font-size:18px}.info small{font-size:11px;color:var(--muted)}button{font-family:inherit}.primary{width:100%;min-height:54px;border:0;border-radius:18px;background:var(--sky);color:white;font-size:16px;font-weight:950}.primary:disabled{opacity:.45}.secondary{width:100%;min-height:50px;border:1px solid var(--line);border-radius:17px;background:#fff;color:var(--ink);font-size:14px;font-weight:900;margin-top:9px}.history{margin-top:13px;font-size:12px;color:var(--muted);line-height:1.7}.warn{margin-top:12px;color:var(--bad);font-size:12px;font-weight:850}.quiz{display:none}.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.qcount,.timer,.unanswered{font-size:12px;font-weight:900;background:var(--sky-soft);color:var(--sky-dark);padding:8px 9px;border-radius:999px;white-space:nowrap}.timer.danger{background:#FFF0EE;color:var(--bad)}.progress{height:7px;background:#E4ECF4;border-radius:999px;overflow:hidden;margin-bottom:14px}.progress span{display:block;height:100%;background:var(--sky)}.qcard{background:#fff;border:1px solid var(--line);border-radius:28px;padding:26px 18px}.wordrow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0 22px}.qword{font-size:40px;font-weight:950;letter-spacing:-.05em;text-align:center}.speak{width:48px;height:48px;border-radius:50%;border:1px solid #CFEAFF;background:var(--sky-soft);color:var(--sky-dark);font-size:21px}.options{display:grid;gap:9px}.option{min-height:54px;border:1px solid var(--line);border-radius:17px;background:#fff;color:var(--ink);font-size:14px;font-weight:850;text-align:left;padding:12px 14px}.option.selected{border-color:var(--sky);background:var(--sky-soft);color:#226FA9}.quiznav{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.quiznav button{min-height:50px;border-radius:17px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:900}.quiznav .submit{background:var(--sky);border-color:var(--sky);color:#fff}.result{display:none;text-align:center}.score{font-size:48px;font-weight:950;color:var(--sky-dark);margin:12px 0}.wronglist{text-align:left;margin-top:18px;max-height:440px;overflow:auto}.wrongitem{padding:12px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.5}.wrongitem b{display:block;font-size:15px;margin-bottom:3px}.resume{display:none;margin-bottom:10px}@media(max-width:380px){.brand{font-size:18px}.qword{font-size:35px}.qtop{flex-wrap:wrap}}
</style>
</head>
<body>
<main class="app"><audio id="pronAudio" preload="auto" playsinline style="display:none"></audio>
<header class="header"><div class="brand">수행평가전 테스트</div><div class="badge" id="attemptBadge">0 / 5회</div></header>
<nav class="mainnav"><a href="./">학습</a><a class="active" href="test.html">테스트</a></nav>
<section class="panel" id="startPanel">
<h2>테스트 시작</h2><p>1,000개 단어 중 100문제를 무작위로 출제합니다. 시험이 시작되면 문제와 선택지는 고정되며, 이전 문항으로 돌아가도 답안이 유지됩니다.</p>
<div class="info"><div><b>100</b><small>문제 수</small></div><div><b>30분</b><small>제한시간</small></div><div><b>5회</b><small>최대 응시</small></div></div>
<button class="primary resume" id="resumeBtn" type="button">진행 중인 테스트 계속하기</button><button class="primary" id="startBtn" type="button">새 테스트 시작</button><div class="history" id="history"></div><div class="warn" id="limitMsg"></div>
</section>
<section class="quiz" id="quizPanel">
<div class="qtop"><div class="qcount" id="qcount">1 / 100</div><div class="unanswered" id="unanswered">미응답 100</div><div class="timer" id="timer">30:00</div></div><div class="progress"><span id="qbar"></span></div>
<div class="qcard"><div class="wordrow"><div class="qword" id="qword"></div><button class="speak" id="speakBtn" type="button" aria-label="영단어 발음 듣기">🔊</button></div><div style="display:flex;justify-content:center;align-items:center;gap:8px;margin:-8px 0 16px;flex-wrap:wrap"><select id="accentSelect" style="min-height:36px;border:1px solid #CFEAFF;border-radius:999px;background:#fff;color:#2E8FD9;font-size:12px;font-weight:850;padding:5px 10px"><option value="us">미국식 발음</option><option value="uk">영국식 발음</option></select><span id="voiceStatus" style="font-size:10px;color:#748091">사전 원어민 음원 준비 중</span></div><div class="options" id="options"></div></div>
<div class="quiznav"><button id="prevBtn" type="button">← 이전</button><button class="submit" id="nextBtn" type="button">다음 →</button></div>
</section>
<section class="panel result" id="resultPanel"><h2>테스트 완료</h2><div class="score" id="score"></div><p id="resultText"></p><button class="primary" id="reviewBtn" type="button">오답 플래시카드로 복습</button><button class="secondary" id="backBtn" type="button">테스트 첫 화면으로</button><div class="wronglist" id="wrongList"></div></section>
</main>
<script src="words-v41.js"></script>
<script>
(()=>{
"use strict";
const HISTORY_KEY="wooshin-vocab-test-history-v41", ACTIVE_KEY="wooshin-vocab-active-test-v41", WRONG_KEY="wooshin-vocab-test-wrong-v41";const MAX_ATTEMPTS=5,TIME_SECONDS=30*60,TARGET=100;let active=null,timerId=null,lastWrong=[];const $=id=>document.getElementById(id);const byId=new Map(WORDS.map(x=>[x.id,x]));
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function history(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]")}catch(_){return[]}}function saveHistory(h){localStorage.setItem(HISTORY_KEY,JSON.stringify(h))}function loadActive(){try{return JSON.parse(localStorage.getItem(ACTIVE_KEY)||"null")}catch(_){return null}}function saveActive(){if(active)localStorage.setItem(ACTIVE_KEY,JSON.stringify(active));else localStorage.removeItem(ACTIVE_KEY)}
const pronunciationCache=new Map();
const readyPronunciations=new Map();
const pronAudio=$("pronAudio");
function audioKey(text,accent){return accent+":"+String(text).toLowerCase()}
function accentPattern(accent){
  return accent==="uk"
    ? /(?:[_-](?:uk|gb)(?:[_-]|\.|$)|en[-_]gb)/i
    : /(?:[_-]us(?:[_-]|\.|$)|en[-_]us)/i;
}
function bestEnglishVoice(accent){
  if(!("speechSynthesis" in window))return null;
  const voices=window.speechSynthesis.getVoices();
  const locale=accent==="uk"?"en-GB":"en-US";
  const preferred=["Google US English","Google UK English Female","Google UK English Male","Samantha","Daniel","Microsoft Aria","Microsoft Jenny","Microsoft Sonia"];
  return preferred.map(n=>voices.find(v=>v.name.includes(n)&&v.lang.toLowerCase().startsWith(locale.toLowerCase()))).find(Boolean)
    ||voices.find(v=>v.lang.toLowerCase()===locale.toLowerCase()&&/google|microsoft|samsung|apple/i.test(v.name))
    ||voices.find(v=>v.lang.toLowerCase()===locale.toLowerCase())
    ||voices.find(v=>v.lang.toLowerCase().startsWith("en-"))
    ||null;
}
function fallbackSpeak(text,accent){
  if(!("speechSynthesis" in window)){
    return;
  }
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=accent==="uk"?"en-GB":"en-US";
  u.rate=.82;
  u.pitch=1;
  const v=bestEnglishVoice(accent);
  if(v)u.voice=v;
  window.speechSynthesis.speak(u);
}
async function resolvePronunciation(text,accent){
  const key=audioKey(text,accent);
  if(pronunciationCache.has(key))return pronunciationCache.get(key);

  const task=(async()=>{
    try{
      const res=await fetch(
        "https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(text),
        {cache:"no-store",mode:"cors"}
      );
      if(!res.ok)throw new Error("dictionary");
      const data=await res.json();
      const phonetics=(data||[])
        .flatMap(x=>Array.isArray(x.phonetics)?x.phonetics:[])
        .filter(x=>x&&x.audio);

      const exact=phonetics.find(x=>accentPattern(accent).test(x.audio));
      const chosen=exact||phonetics.find(x=>x.audio);
      if(!chosen?.audio)return null;

      let url=chosen.audio;
      if(url.startsWith("//"))url="https:"+url;
      return {url,exact:!!exact};
    }catch(_){
      return null;
    }
  })();

  pronunciationCache.set(key,task);
  return task;
}
async function preparePronunciation(text){
  const accent=$("accentSelect")?.value||"us";
  const key=audioKey(text,accent);
  const status=$("voiceStatus");
  const btn=$("speakBtn");

  if(status)status.textContent="사전 원어민 음원 준비 중";
  if(btn)btn.disabled=true;

  const info=await resolvePronunciation(text,accent);

  if(!active)return info;
  const current=byId.get(active.questions[active.index].id);
  if(!current || current.word!==text || ($("accentSelect")?.value||"us")!==accent){
    return info;
  }

  if(info?.url){
    readyPronunciations.set(key,info);
    pronAudio.pause();
    pronAudio.src=info.url;
    pronAudio.dataset.word=text;
    pronAudio.dataset.accent=accent;
    pronAudio.load();

    if(status){
      status.textContent=info.exact
        ? (accent==="uk"?"영국식 사전 원어민 음원":"미국식 사전 원어민 음원")
        : "사전 원어민 음원 · 선택 억양 대체";
    }
  }else{
    readyPronunciations.set(key,null);
    if(status)status.textContent="사전 녹음 없음 · 기기 영어 음성 사용";
  }

  if(btn)btn.disabled=false;
  return info;
}
function say(text){
  const accent=$("accentSelect")?.value||"us";
  const key=audioKey(text,accent);

  if("speechSynthesis" in window)window.speechSynthesis.cancel();

  if(readyPronunciations.has(key)){
    const info=readyPronunciations.get(key);

    if(info?.url){
      if(pronAudio.dataset.word!==text || pronAudio.dataset.accent!==accent){
        pronAudio.pause();
        pronAudio.src=info.url;
        pronAudio.dataset.word=text;
        pronAudio.dataset.accent=accent;
        pronAudio.load();
      }

      try{
        pronAudio.currentTime=0;
        const pp=pronAudio.play();
        if(pp?.catch){
          pp.catch(()=>{
            fallbackSpeak(text,accent);
          });
        }
        return;
      }catch(_){
        fallbackSpeak(text,accent);
        return;
      }
    }

    fallbackSpeak(text,accent);
    return;
  }

  preparePronunciation(text);
}
function uniqueDistractors(correct){const pool=shuffle(WORDS.filter(x=>x.meaning!==correct));const out=[];const seen=new Set([correct]);for(const x of pool){if(!seen.has(x.meaning)){seen.add(x.meaning);out.push(x.meaning);if(out.length===3)break}}return out}
function newQuestion(x){return{id:x.id,options:shuffle([x.meaning,...uniqueDistractors(x.meaning)]),selected:null}}
function refreshStart(){const h=history(),a=loadActive();$("attemptBadge").textContent=`${h.length+(a?1:0)} / ${MAX_ATTEMPTS}회`;$("history").innerHTML=h.length?"응시 기록: "+h.map((x,i)=>`${i+1}회 ${x.score}/${x.total} (${x.percent}%)`).join(" · "):"아직 완료한 응시 기록이 없습니다.";$("resumeBtn").style.display=a?"block":"none";const used=h.length+(a?1:0);$("startBtn").disabled=used>=MAX_ATTEMPTS||!!a;$("limitMsg").textContent=used>=MAX_ATTEMPTS&&!a?"최대 5회 응시를 모두 완료했습니다.":a?"진행 중인 테스트가 있습니다. 먼저 이어서 완료해 주세요.":""}
function startNew(){const h=history();if(h.length>=MAX_ATTEMPTS||loadActive())return;const chosen=shuffle(WORDS).slice(0,Math.min(TARGET,WORDS.length));active={attemptNo:h.length+1,endAt:Date.now()+TIME_SECONDS*1000,index:0,questions:chosen.map(newQuestion)};saveActive();showQuiz()}
function resume(){active=loadActive();if(!active)return;if(Date.now()>=active.endAt){finish(true);return}showQuiz()}
function showQuiz(){$("startPanel").style.display="none";$("resultPanel").style.display="none";$("quizPanel").style.display="block";render();clearInterval(timerId);timerId=setInterval(tick,1000)}
function remaining(){return Math.max(0,Math.ceil((active.endAt-Date.now())/1000))}function tick(){const r=remaining();renderTimer(r);if(r<=0)finish(true)}function renderTimer(r=remaining()){const m=Math.floor(r/60),s=r%60;$("timer").textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;$("timer").classList.toggle("danger",r<=300)}
function render(){if(!active)return;active.index=Math.max(0,Math.min(active.index,active.questions.length-1));const q=active.questions[active.index],x=byId.get(q.id);$("qcount").textContent=`${active.index+1} / ${active.questions.length}`;$("qbar").style.width=`${((active.index+1)/active.questions.length)*100}%`;$("qword").textContent=x.word;preparePronunciation(x.word);const unanswered=active.questions.filter(q=>q.selected===null).length;$("unanswered").textContent=`미응답 ${unanswered}`;const box=$("options");box.innerHTML="";q.options.forEach(t=>{const b=document.createElement("button");b.type="button";b.className="option"+(q.selected===t?" selected":"");b.textContent=t;b.addEventListener("click",()=>{q.selected=t;saveActive();render()});box.appendChild(b)});$("prevBtn").disabled=active.index===0;$("nextBtn").textContent=active.index===active.questions.length-1?"제출하기":"다음 →";renderTimer()}
function submit(){const unanswered=active.questions.filter(q=>q.selected===null).length;if(unanswered&& !confirm(`미응답 문항이 ${unanswered}개 있습니다. 그래도 제출할까요?`))return;if(confirm("테스트를 최종 제출할까요?"))finish(false)}
function finish(auto){if(!active)active=loadActive();if(!active)return;clearInterval(timerId);const wrong=[];let score=0;for(const q of active.questions){const x=byId.get(q.id);if(q.selected===x.meaning)score++;else wrong.push({id:x.id,word:x.word,meaning:x.meaning,selected:q.selected})}const h=history();const percent=Math.round(score/active.questions.length*100);h.push({score,total:active.questions.length,percent,endedAt:new Date().toISOString(),autoSubmitted:auto});saveHistory(h);lastWrong=wrong.map(x=>x.id);localStorage.setItem(WRONG_KEY,JSON.stringify(lastWrong));active=null;saveActive();$("quizPanel").style.display="none";$("resultPanel").style.display="block";$("score").textContent=`${score} / ${TARGET}`;$("resultText").textContent=`정답률 ${percent}% · 오답 ${wrong.length}개${auto?" · 시간 종료로 자동 제출되었습니다.":""}`;$("reviewBtn").style.display=wrong.length?"block":"none";$("wrongList").innerHTML=wrong.length?"<h3>오답 확인</h3>"+wrong.map(x=>`<div class="wrongitem"><b>${x.word}</b>정답: ${x.meaning}<br>선택: ${x.selected??"미응답"}</div>`).join(""):"<div class='wrongitem'><b>전부 정답입니다!</b></div>";refreshStart()}
$("startBtn").addEventListener("click",startNew);$("resumeBtn").addEventListener("click",resume);$("prevBtn").addEventListener("click",()=>{if(active&&active.index>0){active.index--;saveActive();render()}});$("nextBtn").addEventListener("click",()=>{if(!active)return;if(active.index===active.questions.length-1)submit();else{active.index++;saveActive();render()}});$("speakBtn").addEventListener("click",()=>{if(active)say(byId.get(active.questions[active.index].id).word)});["pointerdown","touchstart","click"].forEach(evt=>$("accentSelect").addEventListener(evt,e=>e.stopPropagation(),{passive:true}));$("accentSelect").addEventListener("change",e=>{e.stopPropagation();readyPronunciations.clear();pronunciationCache.clear();if(active)preparePronunciation(byId.get(active.questions[active.index].id).word)});$("reviewBtn").addEventListener("click",()=>{location.href="./?mode=test-wrong"});$("backBtn").addEventListener("click",()=>{$("resultPanel").style.display="none";$("startPanel").style.display="block";refreshStart()});window.addEventListener("beforeunload",e=>{if(active){e.preventDefault();e.returnValue=""}});
refreshStart();const existing=loadActive();if(existing){active=existing;if(Date.now()>=active.endAt)finish(true)}if("speechSynthesis" in window){window.speechSynthesis.getVoices();window.speechSynthesis.addEventListener?.("voiceschanged",()=>window.speechSynthesis.getVoices())}if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
})();
</script>
</body>
</html>
