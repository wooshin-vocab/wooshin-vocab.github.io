<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#56B2FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="빠른 영단어">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>우신고 빠른 영단어 학습기</title>
<style>
:root{--sky:#56B2FF;--sky2:#EAF6FF;--ink:#172033;--muted:#778394;--line:#DDE6EF;--bg:#F6FAFF;--card:#fff;--good:#2BA66A;--bad:#EB6555}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:520px;margin:0 auto;padding:18px 16px 30px}
.header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:21px;font-weight:950;letter-spacing:-.045em}.counter{font-size:13px;font-weight:900;color:#318EDB;background:var(--sky2);padding:8px 11px;border-radius:999px}
.mainnav{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0 10px}.mainnav a{text-decoration:none;text-align:center;min-height:48px;border-radius:17px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center}.mainnav .active{background:var(--sky);border-color:var(--sky);color:#fff}
.modebar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:11px}.modebar button{min-height:43px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-size:11px;font-weight:900;padding:5px}.modebar button.active{background:var(--sky);border-color:var(--sky);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:11px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:9px 5px;text-align:center}.stat b{display:block;font-size:19px}.stat small{font-size:11px;color:var(--muted)}
.progress{height:7px;background:#E4ECF4;border-radius:999px;overflow:hidden;margin-bottom:15px}.progress span{display:block;height:100%;background:var(--sky);width:0;transition:width .2s}
.stage{height:340px;perspective:1200px}.card{height:100%;position:relative;transform-style:preserve-3d;transition:transform .42s}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;background:#fff;border:1px solid var(--line);border-radius:30px;box-shadow:0 14px 36px rgba(23,32,51,.08);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px}.back{transform:rotateY(180deg)}
.label{font-size:12px;font-weight:950;letter-spacing:.12em;color:var(--sky);margin-bottom:24px}.important{display:none;margin-bottom:12px;padding:6px 10px;border-radius:999px;background:#FFF3C9;color:#9C6800;font-size:11px;font-weight:900}.important.show{display:inline-block}.word{font-size:46px;font-weight:950;letter-spacing:-.05em;line-height:1.05}.meaning{font-size:34px;font-weight:900;letter-spacing:-.04em;line-height:1.28}.hint{margin-top:24px;color:var(--muted);font-size:13px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}button{font-family:inherit}.action{min-height:52px;border:1px solid var(--line);border-radius:18px;background:#fff;color:var(--ink);font-size:15px;font-weight:900}.bad{color:var(--bad)}.good{color:var(--good)}.shuffle{width:100%;margin-top:10px;background:var(--sky);border-color:var(--sky);color:#fff}.reset{width:100%;margin-top:10px;background:#fff;color:var(--bad)}
.empty{display:none;background:#fff;border:1px dashed #C7D4E1;border-radius:25px;padding:34px 20px;text-align:center}.empty strong{display:block;font-size:20px;margin-bottom:8px}.empty span{font-size:13px;color:var(--muted)}
.note{text-align:center;font-size:12px;color:var(--muted);line-height:1.5;margin-top:14px}
@media(max-width:380px){.stage{height:310px}.word{font-size:39px}.meaning{font-size:29px}.modebar button{font-size:10px}}
</style>
</head>
<body>
<main class="app">
<header class="header"><div class="brand">우신고 빠른 영단어 학습기</div><div class="counter" id="counter">1 / 10</div></header>
<nav class="mainnav"><a class="active" href="./">학습</a><a href="test.html">테스트</a></nav>
<div class="modebar">
<button class="active" data-mode="all" type="button">전체</button>
<button data-mode="random" type="button">랜덤학습</button>
<button data-mode="unknown" type="button">모르는 단어 <span id="unknownCount">0</span></button>
<button data-mode="known" type="button">암기완료 <span id="knownCount">0</span></button>
</div>
<section class="stats">
<div class="stat"><b id="totalStat">10</b><small>전체</small></div>
<div class="stat"><b id="unknownStat">0</b><small>모름</small></div>
<div class="stat"><b id="knownStat">0</b><small>암기완료</small></div>
</section>
<div class="progress"><span id="bar"></span></div>
<section id="studyArea">
<div class="stage" id="stage" tabindex="0">
<div class="card" id="card">
<div class="face"><div class="important" id="imp1">중요단어</div><div class="label">WORD</div><div class="word" id="word"></div><div class="hint">카드를 눌러 뜻 보기</div></div>
<div class="face back"><div class="important" id="imp2">중요단어</div><div class="label">MEANING</div><div class="meaning" id="meaning"></div><div class="hint">다시 누르면 단어 보기</div></div>
</div></div>
<div class="row"><button class="action bad" id="unknownBtn" type="button">모름</button><button class="action good" id="knownBtn" type="button">암기 완료</button></div>
<div class="row"><button class="action" id="prevBtn" type="button">← 이전</button><button class="action" id="nextBtn" type="button">다음 →</button></div>
<button class="action shuffle" id="shuffleBtn" type="button">현재 범위 다시 섞기</button>
</section>
<section class="empty" id="emptyArea"><strong id="emptyTitle"></strong><span id="emptyText"></span></section>
<button class="action reset" id="resetBtn" type="button">전체 학습기록 초기화</button>
<div class="note">모름·암기완료 기록은 이 기기에 저장됩니다. 전체 초기화 시 학습기록과 테스트 기록이 모두 삭제됩니다.</div>
</main>
<script src="words.js"></script>
<script>
const LEARN_KEY="wooshin-vocab-learning-v3", TEST_KEY="wooshin-vocab-tests-v3";
const state={mode:"all",index:0,deck:[],flipped:false,known:new Set(),unknown:new Set()};
const $=id=>document.getElementById(id);
function shuffled(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function load(){try{const d=JSON.parse(localStorage.getItem(LEARN_KEY)||"{}");(d.known||[]).forEach(x=>state.known.add(x));(d.unknown||[]).forEach(x=>state.unknown.add(x))}catch(e){}}
function save(){localStorage.setItem(LEARN_KEY,JSON.stringify({known:[...state.known],unknown:[...state.unknown]}))}
function stats(){$("totalStat").textContent=WORDS.length;$("unknownStat").textContent=state.unknown.size;$("knownStat").textContent=state.known.size;$("unknownCount").textContent=state.unknown.size;$("knownCount").textContent=state.known.size;document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("active",b.dataset.mode===state.mode))}
function build(){if(state.mode==="unknown")state.deck=WORDS.filter(x=>state.unknown.has(x.word));else if(state.mode==="known")state.deck=WORDS.filter(x=>state.known.has(x.word));else if(state.mode==="random")state.deck=shuffled(WORDS);else state.deck=[...WORDS];state.index=0;render()}
function render(){stats();if(!state.deck.length){$("studyArea").style.display="none";$("emptyArea").style.display="block";$("counter").textContent="0 / 0";$("bar").style.width="0%";$("emptyTitle").textContent=state.mode==="unknown"?"모르는 단어가 없습니다":state.mode==="known"?"암기 완료 단어가 없습니다":"등록된 단어가 없습니다";$("emptyText").textContent=state.mode==="unknown"?"전체 학습에서 ‘모름’을 누르면 여기에 자동으로 모입니다.":state.mode==="known"?"‘암기 완료’를 누른 단어가 여기에 모입니다.":"words.js를 확인해 주세요.";return}$("studyArea").style.display="block";$("emptyArea").style.display="none";state.index=Math.min(state.index,state.deck.length-1);state.flipped=false;$("card").classList.remove("flipped");const x=state.deck[state.index];$("word").textContent=x.word;$("meaning").textContent=x.meaning;$("counter").textContent=`${state.index+1} / ${state.deck.length}`;$("bar").style.width=`${((state.index+1)/state.deck.length)*100}%`;$("imp1").classList.toggle("show",!!x.important);$("imp2").classList.toggle("show",!!x.important)}
function flip(){state.flipped=!state.flipped;$("card").classList.toggle("flipped",state.flipped)}
function next(){state.index=(state.index+1)%state.deck.length;render()} function prev(){state.index=(state.index-1+state.deck.length)%state.deck.length;render()}
function classify(kind){if(!state.deck.length)return;const w=state.deck[state.index].word;if(kind==="known"){state.known.add(w);state.unknown.delete(w)}else{state.unknown.add(w);state.known.delete(w)}save();if(state.mode==="all"||state.mode==="random"){next();return}const old=state.index;state.deck=state.mode==="unknown"?WORDS.filter(x=>state.unknown.has(x.word)):WORDS.filter(x=>state.known.has(x.word));state.index=state.deck.length?Math.min(old,state.deck.length-1):0;render()}
$("stage").addEventListener("click",flip);$("nextBtn").addEventListener("click",next);$("prevBtn").addEventListener("click",prev);$("knownBtn").addEventListener("click",()=>classify("known"));$("unknownBtn").addEventListener("click",()=>classify("unknown"));$("shuffleBtn").addEventListener("click",()=>{state.deck=shuffled(state.deck);state.index=0;render()});document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{state.mode=b.dataset.mode;build()}));
$("resetBtn").addEventListener("click",()=>{if(confirm("학습기록과 테스트 기록을 모두 초기화할까요?")){state.known.clear();state.unknown.clear();localStorage.removeItem(LEARN_KEY);localStorage.removeItem(TEST_KEY);state.mode="all";build();alert("전체 기록을 초기화했습니다.")}});
load();build();
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
