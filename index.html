<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#56B2FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="빠른 영단어">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>우신고 빠른 영단어 학습기</title>
<style>
:root{--sky:#56B2FF;--sky-dark:#2E8FD9;--sky-soft:#EAF6FF;--ink:#172033;--muted:#748091;--line:#DCE6EF;--bg:#F6FAFF;--card:#fff;--good:#2BA66A;--good-bg:#EBF8F1;--bad:#EB6555;--bad-bg:#FFF0EE;--warn:#A56B00;--warn-bg:#FFF4CD}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100%;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,a{font-family:inherit}.app{max-width:520px;margin:0 auto;padding:18px 16px 30px}.header{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:20px;font-weight:950;letter-spacing:-.045em}.counter{font-size:13px;font-weight:900;color:var(--sky-dark);background:var(--sky-soft);padding:8px 10px;border-radius:999px;white-space:nowrap}.mainnav{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0 10px}.mainnav a{text-decoration:none;min-height:48px;border-radius:17px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center}.mainnav .active{background:var(--sky);border-color:var(--sky);color:#fff}.modebar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}.modebar button{min-height:44px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-size:11px;font-weight:900;padding:5px}.modebar button.active{background:var(--sky);border-color:var(--sky);color:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:9px 5px;text-align:center}.stat b{display:block;font-size:19px}.stat small{font-size:11px;color:var(--muted)}.wrong-review{width:100%;display:none;min-height:44px;border:1px solid #F3D98B;border-radius:14px;background:#FFF9E6;color:#8B6500;font-size:12px;font-weight:900;margin:0 0 10px}.progress{height:7px;background:#E4ECF4;border-radius:999px;overflow:hidden;margin-bottom:15px}.progress span{display:block;height:100%;background:var(--sky);width:0;transition:width .2s}.stage{height:350px;perspective:1200px}.card{height:100%;position:relative;transform-style:preserve-3d;transition:transform .42s ease}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;background:#fff;border:1px solid var(--line);border-radius:30px;box-shadow:0 14px 36px rgba(23,32,51,.08);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px}.back{transform:rotateY(180deg)}.label{font-size:12px;font-weight:950;letter-spacing:.12em;color:var(--sky);margin-bottom:19px}.important{display:none;margin-bottom:12px;padding:6px 10px;border-radius:999px;background:var(--warn-bg);color:var(--warn);font-size:11px;font-weight:900}.important.show{display:inline-block}.word{font-size:46px;font-weight:950;letter-spacing:-.05em;line-height:1.06;word-break:break-word}.meaning{font-size:33px;font-weight:900;letter-spacing:-.04em;line-height:1.3;word-break:keep-all}.hint{margin-top:20px;color:var(--muted);font-size:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.action{min-height:52px;border:1px solid var(--line);border-radius:18px;background:#fff;color:var(--ink);font-size:15px;font-weight:900}.action:active,.modebar button:active{transform:scale(.985)}.bad{color:var(--bad);background:var(--bad-bg);border-color:#FFD8D3}.good{color:var(--good);background:var(--good-bg);border-color:#CDEEDC}.shuffle{width:100%;margin-top:10px;background:var(--sky);border-color:var(--sky);color:#fff}.reset{width:100%;margin-top:10px;background:#fff;color:var(--bad)}.empty{display:none;background:#fff;border:1px dashed #C7D4E1;border-radius:25px;padding:34px 20px;text-align:center}.empty strong{display:block;font-size:20px;margin-bottom:8px}.empty span{font-size:13px;color:var(--muted);line-height:1.55}.note{text-align:center;font-size:11px;color:var(--muted);line-height:1.55;margin-top:13px}.toast{min-height:18px;text-align:center;margin-top:8px;color:var(--sky-dark);font-size:12px;font-weight:800}@media(max-width:380px){.app{padding-left:13px;padding-right:13px}.brand{font-size:18px}.stage{height:320px}.word{font-size:39px}.meaning{font-size:28px}.modebar button{font-size:10px}}

.roundbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.roundbar button{min-height:48px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);font-size:13px;font-weight:950;padding:6px}
.roundbar button small{display:block;margin-top:2px;font-size:10px;font-weight:800;color:var(--muted)}
.roundbar button.active{background:#173B68;border-color:#173B68;color:#fff}
.roundbar button.active small{color:#DDEBFA}
.round-title{text-align:center;font-size:12px;font-weight:900;color:#42617F;margin:-1px 0 8px}

</style>
</head>
<body>
<main class="app">
<header class="header"><div class="brand">우신고 빠른 영단어 학습기</div><div class="counter" id="counter">1회차 · 1 / 500</div></header>
<nav class="mainnav"><a class="active" href="./">학습</a><a href="test.html">테스트</a></nav>
<div class="roundbar" aria-label="학습 회차 선택">
<button class="active" data-round="1" type="button">1회차<small>1~500번</small></button>
<button data-round="2" type="button">2회차<small>501~1000번</small></button>
</div>
<div class="round-title" id="roundTitle">1회차 · 1~500번 단어</div>

<div class="modebar">
<button class="active" data-mode="all" type="button">전체</button>
<button data-mode="random" type="button">랜덤학습</button>
<button data-mode="unknown" type="button">모르는 단어 <span id="unknownCount">0</span></button>
<button data-mode="known" type="button">암기완료 <span id="knownCount">0</span></button>
</div>
<section class="stats"><div class="stat"><b id="totalStat">500</b><small>현재 회차</small></div><div class="stat"><b id="unknownStat">0</b><small>모름</small></div><div class="stat"><b id="knownStat">0</b><small>암기완료</small></div></section>
<button class="wrong-review" id="wrongReviewBtn" type="button">테스트 오답 복습 <span id="testWrongCount">0</span>개</button>
<div class="progress"><span id="bar"></span></div>
<section id="studyArea">
<div class="stage" id="stage" tabindex="0" aria-label="플래시카드. 누르면 뜻이 보입니다."><div class="card" id="card">
<div class="face"><div class="important" id="imp1">★ 중요단어</div><div class="label">WORD</div><div class="word" id="word"></div><div class="hint">카드를 눌러 뜻 보기</div></div>
<div class="face back"><div class="important" id="imp2">★ 중요단어</div><div class="label">MEANING</div><div class="meaning" id="meaning"></div><div class="hint">다시 누르면 단어 보기</div></div>
</div></div>
<div class="row"><button class="action bad" id="unknownBtn" type="button">모름</button><button class="action good" id="knownBtn" type="button">암기 완료</button></div>
<div class="row"><button class="action" id="prevBtn" type="button">← 이전</button><button class="action" id="nextBtn" type="button">다음 →</button></div>
<button class="action shuffle" id="shuffleBtn" type="button">현재 범위 다시 섞기</button>
</section>
<section class="empty" id="emptyArea"><strong id="emptyTitle"></strong><span id="emptyText"></span></section>
<div class="toast" id="toast" aria-live="polite"></div>
<button class="action reset" id="resetBtn" type="button">전체 학습기록 초기화</button>
<div class="note">1회차와 2회차의 학습·테스트 기록은 이 기기의 브라우저에 저장됩니다. 전체 초기화 시 두 회차의 모름·암기완료·테스트 응시기록·오답기록이 모두 삭제됩니다.</div>
</main>
<script src="words-v41.js"></script>
<script>
(()=>{
"use strict";

const LEARN_KEY="wooshin-vocab-learning-v6";
const OLD_LEARN_KEY="wooshin-vocab-learning-v41";
const ROUND_KEY="wooshin-vocab-selected-round-v6";
const state={round:1,mode:"all",index:0,deck:[],flipped:false,known:new Set(),unknown:new Set(),testWrong:new Set()};

const $=id=>document.getElementById(id);
const card=$("card"),word=$("word"),meaning=$("meaning"),counter=$("counter"),bar=$("bar"),
      studyArea=$("studyArea"),emptyArea=$("emptyArea"),toast=$("toast");

function roundWords(round=state.round){
  return round===1 ? WORDS.slice(0,500) : WORDS.slice(500,1000);
}
function roundBounds(round=state.round){
  return round===1 ? [1,500] : [501,1000];
}
function wrongKey(round=state.round){
  return `wooshin-vocab-test-wrong-v6-r${round}`;
}
function historyKey(round){
  return `wooshin-vocab-test-history-v6-r${round}`;
}
function activeKey(round){
  return `wooshin-vocab-active-test-v6-r${round}`;
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function load(){
  try{
    const savedRound=Number(localStorage.getItem(ROUND_KEY)||1);
    state.round=savedRound===2?2:1;
  }catch(_){}
  try{
    let raw=localStorage.getItem(LEARN_KEY);
    if(!raw){
      raw=localStorage.getItem(OLD_LEARN_KEY);
      if(raw) localStorage.setItem(LEARN_KEY,raw);
    }
    const d=JSON.parse(raw||"{}");
    (d.known||[]).forEach(x=>state.known.add(Number(x)));
    (d.unknown||[]).forEach(x=>state.unknown.add(Number(x)));
  }catch(_){}
  loadWrong();
}
function loadWrong(){
  state.testWrong.clear();
  try{
    (JSON.parse(localStorage.getItem(wrongKey())||"[]")||[]).forEach(x=>state.testWrong.add(Number(x)));
  }catch(_){}
}
function save(){
  try{
    localStorage.setItem(LEARN_KEY,JSON.stringify({known:[...state.known],unknown:[...state.unknown]}));
    localStorage.setItem(ROUND_KEY,String(state.round));
  }catch(_){}
}
function showToast(msg){
  toast.textContent=msg;
  clearTimeout(showToast.t);
  showToast.t=setTimeout(()=>toast.textContent="",1300);
}
function scopedCount(set){
  const ids=new Set(roundWords().map(x=>x.id));
  let n=0;
  set.forEach(id=>{if(ids.has(id))n++;});
  return n;
}
function sync(){
  const pool=roundWords();
  const [start,end]=roundBounds();
  const unknownN=scopedCount(state.unknown);
  const knownN=scopedCount(state.known);

  $("totalStat").textContent=pool.length;
  $("unknownStat").textContent=unknownN;
  $("knownStat").textContent=knownN;
  $("unknownCount").textContent=unknownN;
  $("knownCount").textContent=knownN;
  $("testWrongCount").textContent=state.testWrong.size;
  $("wrongReviewBtn").style.display=state.testWrong.size?"block":"none";
  $("roundTitle").textContent=`${state.round}회차 · ${start}~${end}번 단어`;

  document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("active",b.dataset.mode===state.mode));
  document.querySelectorAll("[data-round]").forEach(b=>b.classList.toggle("active",Number(b.dataset.round)===state.round));
}
function build(){
  const pool=roundWords();
  if(state.mode==="unknown") state.deck=pool.filter(x=>state.unknown.has(x.id));
  else if(state.mode==="known") state.deck=pool.filter(x=>state.known.has(x.id));
  else if(state.mode==="random") state.deck=shuffle(pool);
  else if(state.mode==="testwrong") state.deck=pool.filter(x=>state.testWrong.has(x.id));
  else state.deck=[...pool];
  state.index=0;
  render();
}
function render(){
  sync();
  if(!state.deck.length){
    studyArea.style.display="none";
    emptyArea.style.display="block";
    counter.textContent=`${state.round}회차 · 0 / 0`;
    bar.style.width="0%";
    $("emptyTitle").textContent=
      state.mode==="unknown"?"모르는 단어가 없습니다":
      state.mode==="known"?"암기 완료 단어가 없습니다":
      state.mode==="testwrong"?"테스트 오답이 없습니다":"등록된 단어가 없습니다";
    $("emptyText").textContent=
      state.mode==="unknown"?"현재 회차에서 ‘모름’을 누르면 자동으로 모입니다.":
      state.mode==="known"?"현재 회차에서 ‘암기 완료’를 누른 단어가 자동으로 모입니다.":
      state.mode==="testwrong"?"현재 회차 테스트에서 틀린 단어가 있으면 여기에 모입니다.":
      "단어 데이터 파일을 확인해 주세요.";
    return;
  }

  studyArea.style.display="block";
  emptyArea.style.display="none";
  state.index=Math.max(0,Math.min(state.index,state.deck.length-1));
  state.flipped=false;
  card.classList.remove("flipped");

  const x=state.deck[state.index];
  word.textContent=x.word;
  meaning.textContent=x.meaning;
  $("imp1").classList.toggle("show",!!x.important);
  $("imp2").classList.toggle("show",!!x.important);
  counter.textContent=`${state.round}회차 · ${state.index+1} / ${state.deck.length}`;
  bar.style.width=`${((state.index+1)/state.deck.length)*100}%`;
}
function flip(){
  if(!state.deck.length)return;
  state.flipped=!state.flipped;
  card.classList.toggle("flipped",state.flipped);
}
function next(){
  if(!state.deck.length)return;
  state.index=(state.index+1)%state.deck.length;
  render();
}
function prev(){
  if(!state.deck.length)return;
  state.index=(state.index-1+state.deck.length)%state.deck.length;
  render();
}
function classify(kind){
  if(!state.deck.length)return;
  const x=state.deck[state.index];

  if(kind==="known"){
    state.known.add(x.id);
    state.unknown.delete(x.id);
    showToast("암기 완료로 저장했습니다.");
  }else{
    state.unknown.add(x.id);
    state.known.delete(x.id);
    showToast("모르는 단어에 저장했습니다.");
  }
  save();

  if(state.mode==="all"||state.mode==="random"||state.mode==="testwrong"){
    next();
    return;
  }

  const old=state.index;
  const pool=roundWords();
  state.deck=state.mode==="unknown" ? pool.filter(x=>state.unknown.has(x.id)) : pool.filter(x=>state.known.has(x.id));
  state.index=state.deck.length?Math.min(old,state.deck.length-1):0;
  render();
}
function setRound(round){
  if(round!==1&&round!==2)return;
  state.round=round;
  state.mode="all";
  state.index=0;
  loadWrong();
  save();
  build();
  showToast(`${round}회차로 전환했습니다.`);
}

$("stage").addEventListener("click",flip);
$("stage").addEventListener("keydown",e=>{
  if(e.key==="Enter"||e.key===" "){e.preventDefault();flip();}
});
$("nextBtn").addEventListener("click",next);
$("prevBtn").addEventListener("click",prev);
$("knownBtn").addEventListener("click",()=>classify("known"));
$("unknownBtn").addEventListener("click",()=>classify("unknown"));
$("shuffleBtn").addEventListener("click",()=>{
  state.deck=shuffle(state.deck);
  state.index=0;
  render();
  showToast("현재 회차의 학습 범위를 섞었습니다.");
});
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{
  state.mode=b.dataset.mode;
  build();
}));
document.querySelectorAll("[data-round]").forEach(b=>b.addEventListener("click",()=>setRound(Number(b.dataset.round))));
$("wrongReviewBtn").addEventListener("click",()=>{
  state.mode="testwrong";
  build();
});
$("resetBtn").addEventListener("click",()=>{
  if(!confirm("1·2회차의 모름·암기완료·테스트 응시기록·오답기록을 모두 초기화할까요?"))return;
  state.known.clear();
  state.unknown.clear();
  state.testWrong.clear();
  try{
    localStorage.removeItem(LEARN_KEY);
    localStorage.removeItem(OLD_LEARN_KEY);
    localStorage.removeItem(ROUND_KEY);
    for(const r of [1,2]){
      localStorage.removeItem(historyKey(r));
      localStorage.removeItem(activeKey(r));
      localStorage.removeItem(wrongKey(r));
    }
  }catch(_){}
  state.round=1;
  state.mode="all";
  build();
  showToast("두 회차의 전체 기록을 초기화했습니다.");
});

load();
const params=new URLSearchParams(location.search);
const requestedRound=Number(params.get("round"));
if(requestedRound===1||requestedRound===2){
  state.round=requestedRound;
  loadWrong();
}
if(params.get("mode")==="test-wrong"&&state.testWrong.size) state.mode="testwrong";
build();

if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
})();
</script>
</body>
</html>
